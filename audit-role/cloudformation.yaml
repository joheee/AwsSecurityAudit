AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Read-only security-audit role (SecurityAudit, ViewOnlyAccess and Prowler
  additions). Assumed with MFA. No write actions, no access keys.

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: IAM user or role ARN of the auditor allowed to assume this role.
    AllowedPattern: '^arn:aws[a-z-]*:iam::[0-9]{12}:(user|role)/.+$'
    ConstraintDescription: Must be an IAM user or role ARN.
  ExternalId:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional sts:ExternalId, agreed with the auditor. Leave empty to skip.
  RoleName:
    Type: String
    Default: security-audit
  MaxSessionDuration:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
    Description: Maximum session length in seconds.

Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalId, ""]]

Resources:
  AuditRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only role for the AWS security audit (Prowler, Checkov). Assumed with MFA.
      MaxSessionDuration: !Ref MaxSessionDuration
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeWithMfa
            Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: "true"
              StringEquals: !If
                - HasExternalId
                - sts:ExternalId: !Ref ExternalId
                - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
        - !Sub arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess
        - !Ref ProwlerAdditionsPolicy

  # Same actions as audit-role/main.tf (Prowler 5.49.0 additions, read-only).
  # Resource "*" because these are account-wide describe/get calls and most do
  # not support resource-level permissions. securityhub:BatchImportFindings is
  # left out (write action). ecr:BatchGetImage, ecr:GetDownloadUrlForLayer and
  # lambda:GetLayerVersion can download image and layer content.
  ProwlerAdditionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${RoleName}-prowler-additions
      Description: Extra read-only actions for Prowler. No write actions.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ProwlerAdditionsReadOnly
            Effect: Allow
            Resource: "*"
            Action:
              - account:Get*
              - amplify:ListApps
              - amplify:ListBranches
              - appstream:Describe*
              - appstream:List*
              - backup:List*
              - backup:Get*
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:GetBrowser
              - bedrock-agentcore:GetCodeInterpreter
              - bedrock-agentcore:GetGateway
              - bedrock-agentcore:GetGatewayTarget
              - bedrock-agentcore:GetMemory
              - bedrock-agentcore:GetTokenVault
              - bedrock-agentcore:ListAgentRuntimes
              - bedrock-agentcore:ListBrowsers
              - bedrock-agentcore:ListCodeInterpreters
              - bedrock-agentcore:ListGatewayTargets
              - bedrock-agentcore:ListGateways
              - bedrock-agentcore:ListMemories
              - bedrock-agentcore:ListTagsForResource
              - bedrock:List*
              - bedrock:Get*
              - cloudtrail:GetInsightSelectors
              - codeartifact:List*
              - codebuild:BatchGet*
              - codebuild:ListReportGroups
              - cognito-idp:GetUserPoolMfaConfig
              - datapipeline:DescribePipelines
              - datapipeline:GetPipelineDefinition
              - datapipeline:ListPipelines
              - dlm:Get*
              - drs:Describe*
              - ds:Get*
              - ds:Describe*
              - ds:List*
              - dynamodb:GetResourcePolicy
              - ec2:GetEbsEncryptionByDefault
              - ec2:GetSnapshotBlockPublicAccessState
              - ec2:GetInstanceMetadataDefaults
              - ecr:Describe*
              - ecr:GetRegistryScanningConfiguration
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - elasticfilesystem:DescribeBackupPolicy
              - glue:GetConnections
              - glue:GetSecurityConfiguration*
              - glue:SearchTables
              - glue:GetMLTransforms
              - inspector2:BatchGetFindingDetails
              - inspector2:SearchVulnerabilities
              - lambda:GetFunction*
              - lambda:GetLayerVersion
              - logs:FilterLogEvents
              - lightsail:GetRelationalDatabases
              - macie2:GetMacieSession
              - macie2:GetAutomatedDiscoveryConfiguration
              - oam:GetSinkPolicy
              - oam:ListTagsForResource
              - rolesanywhere:ListProfiles
              - rolesanywhere:ListTagsForResource
              - rolesanywhere:ListTrustAnchors
              - s3:GetAccountPublicAccessBlock
              - s3:GetObjectAcl
              - s3:ListBucket
              - shield:DescribeProtection
              - shield:GetSubscriptionState
              - securityhub:GetFindings
              - servicecatalog:Describe*
              - servicecatalog:List*
              - ssm:GetDocument
              - ssm-incidents:List*
              - states:ListTagsForResource
              - support:Describe*
              - tag:GetTagKeys
              - wellarchitected:List*
          - Sid: ProwlerAdditionsApiGatewayRead
            Effect: Allow
            Action:
              - apigateway:GET
            Resource:
              - "arn:*:apigateway:*::/restapis/*"
              - "arn:*:apigateway:*::/apis/*"
              - "arn:*:apigateway:*::/domainnames"
              - "arn:*:apigateway:*::/domainnames/*"

Outputs:
  RoleArn:
    Description: ARN of the audit role. Send this to the auditor.
    Value: !GetAtt AuditRole.Arn
